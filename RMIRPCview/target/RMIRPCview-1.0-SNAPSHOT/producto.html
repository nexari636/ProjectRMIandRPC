<nav class="navbar bg-body-tertiary">
    <div class="container-fluid d-flex align-items-end flex-column">
      <form class="d-flex" role="search">
        <a class="btn btn-primary m-2" data-bs-toggle="modal" data-bs-target="#staticBackdrop" href="#">
          Agregar
        </a>
      </form>
    </div>
  </nav>
  
  
  <div class="container">
    <div class="row">
      <div class="col-md-1"></div>
      <div class="col">
        <div class="row align-items-center">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Cantidad</th>
                <th scope="col">Precio Unitario</th>
              </tr>
            </thead>
            <tbody>
              <tr ng-repeat="per in productos">
                <th scope="row">{{per.nombre}}</th>
                <td>{{per.cantidad}}</td>
                <td>{{per.preciounitario}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="col-md-1"></div>
    </div>
  </div>
  
  
  <!-- Modal -->
  <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="staticBackdropLabel">Productos</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form name="form" ng-submit="guardar(form)">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input class="form-control" id="nombre" name="nombre" ng-model="nombre" type="text" maxlength="50" placeholder="Ingrese el nombre" aria-label="default input example">
            </div>
            <div class="mb-3">
              <label for="preciounitario" class="form-label">Precio</label>
              <input class="form-control" id="preciounitario" name="preciounitario" ng-model="preciounitario" type="text" placeholder="Ingrese el precio unitario" aria-label="default input example">
            </div>
            <div class="mb-3">
              <label for="cantidad" class="form-label">Cantidad</label>
              <input class="form-control" id="cantidad" name="cantidad" ng-model="cantidad" type="number" placeholder="Ingrese la cantidad" aria-label="default input example">
            </div>
            <button class="btn btn-primary" data-bs-dismiss="modal" type="submit" class="btn btn-primary">Guardar</button>
          </form>
        </div>
        <div class="modal-footer">
        </div>
      </div>
    </div>
  </div>
